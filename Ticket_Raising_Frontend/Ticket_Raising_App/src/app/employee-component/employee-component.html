<div class="galaxy-background">
  <div class="container mt-5">
    <div class="row">

      <!-- EMPLOYEE MANAGEMENT FORM (LEFT) -->
      @if (userName && role == "Admin") {
        <div class="col-md-5 mb-4">
          <div class="card p-5 shadow-lg text-white border border-light rounded-4"
               style="background-color: rgba(0, 0, 0, 0.3);">

            <h2 class="text-glow">Employee Management</h2>

            <button class="btn btn-secondary mb-3 glow-btn w-100"
                    (click)="newEmployee()">New</button>

            <!-- Employee ID -->
            <div class="mb-3">
              <label>Employee ID</label>
              <div class="d-flex gap-2">
                <input type="text"
                       class="form-control galaxy-input"
                       [(ngModel)]="employee.empId"
                       name="empId" />
                <button class="btn btn-primary glow-btn"
                        (click)="showEmployee()">Show</button>
              </div>
            </div>

            <!-- First Name -->
            <div class="mb-3">
              <label>First Name</label>
              <input type="text"
                     class="form-control galaxy-input"
                     [(ngModel)]="employee.firstName"
                     name="firstName" />
            </div>

            <!-- Last Name -->
            <div class="mb-3">
              <label>Last Name</label>
              <input type="text"
                     class="form-control galaxy-input"
                     [(ngModel)]="employee.lastName"
                     name="lastName" />
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label>Email</label>
              <input type="email"
                     class="form-control galaxy-input"
                     [(ngModel)]="employee.email"
                     name="email" />
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label>Phone Number</label>
              <input type="text"
                     class="form-control galaxy-input"
                     [(ngModel)]="employee.phoneNumber"
                     name="phoneNumber" />
            </div>

            <!-- Role -->
            <div class="mb-3">
              <label>Role</label>
              <select class="form-select galaxy-input"
                      [(ngModel)]="employee.role"
                      name="role">
                <option value="Admin">Admin</option>
                <option value="User">User</option>
                <option value="Supporter">Supporter</option>
              </select>
            </div>

            <!-- Actions -->
            <div class="mt-3 d-flex gap-2 flex-wrap">
              <button class="btn btn-warning glow-btn"
                      (click)="updateEmployee()">Update</button>
              <button class="btn btn-danger glow-btn"
                      (click)="deleteEmployee()">Delete</button>
            </div>

            <p class="text-danger mt-2">{{ errMsg }}</p>

          </div>
        </div>
      }

      <!-- LIST OF EMPLOYEES (RIGHT) -->
      <div class="col-md-7 mb-4">
        <div class="card galaxy-card p-4">

          <h2 class="text-glow">List of Employees</h2>

          <!-- TABLE WRAPPER (FIXES OVERFLOW) -->
          <div class="table-responsive galaxy-table-wrapper">
            <table class="table table-bordered table-striped galaxy-table mt-3">
              <thead class="table-dark text-glow">
                <tr>
                  <th>Emp ID</th>
                  <th>First Name</th>
                  <th>Last Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Phone</th>
                </tr>
              </thead>
              <tbody>
                @for (e of employees; track e.empId) {
                  <tr>
                    <td>{{ e.empId }}</td>
                    <td>{{ e.firstName }}</td>
                    <td>{{ e.lastName }}</td>
                    <td>{{ e.email }}</td>
                    <td>{{ e.role }}</td>
                    <td>{{ e.phoneNumber }}</td>
                  </tr>
                }
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
