<div class="container mt-4">
  <div class="row">
 
    <div class="col-md-5 mb-4">
      <div class="card p-5 shadow-lg text-white border border-light rounded-4"
           style="background-color: rgba(0, 0, 0, 0.3);">
 
        <h2 class="text-glow">Ticket Type Form</h2>
 
        <button class="btn btn-secondary mb-3 glow-btn w-100"
                (click)="newTicketType()">New</button>
 
        <div class="mb-3">
          <label>Ticket Type ID</label>
          <div class="d-flex gap-2">
            <input type="text"
                   class="form-control galaxy-input"
                   [(ngModel)]="ticketType.ticketTypeId"
                   name="ticketTypeId" />
            <button class="btn btn-primary glow-btn"
                    (click)="showTicketType()">Show</button>
          </div>
        </div>
 
        <div class="mb-3">
          <label>Type Name</label>
          <input type="text"
                 class="form-control galaxy-input"
                 [(ngModel)]="ticketType.typeName"
                 name="typeName" />
        </div>
 
     
        <div class="mb-3">
          <label>Description</label>
          <input type="text"
                 class="form-control galaxy-input"
                 [(ngModel)]="ticketType.description"
                 name="description" />
        </div>
 
        <div class="mb-3">
                <label>Priority</label>
          <div class="d-flex gap-2">
            <select class="form-select galaxy-input"
                    [(ngModel)]="ticketType.priorityId"
                    name="priorityId">
              <option value="">-- Select Priority --</option>
              @for (p of priorities; track p.priorityId) {
                <option [value]="p.priorityId">
                  {{ p.priorityId }}
                </option>
              }
            </select>
 
            <button class="btn btn-primary glow-btn"
                    (click)="showTicketTypesByPriority()">
              Show By Priority
            </button>
          </div>
        </div>
 
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <button class="btn btn-success glow-btn"
                  (click)="saveTicketType()">Add</button>
          <button class="btn btn-warning glow-btn"
                  (click)="updateTicketType()">Update</button>
          <button class="btn btn-danger glow-btn"
                  (click)="deleteTicketType()">Delete</button>
        </div>
 
        <p class="text-danger mt-2">{{ errMsg }}</p>
      </div>
    </div>
 
    <div class="col-md-7 mb-4">
      <div class="card galaxy-card p-4">
        <h2 class="text-glow">List of Ticket Types</h2>
 
        <table class="table table-bordered table-striped galaxy-table mt-3">
          <thead class="table-dark text-glow">
            <tr>
              <th>Ticket Type ID</th>
              <th>Type Name</th>
              <th>Description</th>
              <th>Priority ID</th>
            </tr>
          </thead>
          <tbody>
            @for (tt of ticketTypes; track tt.ticketTypeId) {
            <tr>
              <td>{{ tt.ticketTypeId }}</td>
              <td>{{ tt.typeName }}</td>
              <td>{{ tt.description }}</td>
              <td>{{ tt.priorityId }}</td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
 
  </div>
</div>
