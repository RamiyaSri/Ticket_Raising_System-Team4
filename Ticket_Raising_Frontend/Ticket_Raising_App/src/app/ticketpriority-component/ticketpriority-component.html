<div class="container mt-4">
  <div class="row">
 
    <div class="col-md-5 mb-4">
      <div class="card p-5 shadow-lg text-white border border-light rounded-4"
           style="background-color: rgba(0,0,0,0.3);">
 
        <h2 class="text-glow">Ticket Priority Form</h2>
 
        <button class="btn btn-secondary mb-3 w-100" (click)="newPriority()">New</button>
 
        <div class="mb-3">
          <label>Priority ID</label>
          <div class="d-flex gap-2">
            <input type="text" class="form-control"
                   [(ngModel)]="priority.priorityId" name="priorityId">
            <button class="btn btn-primary" (click)="showPriority()">Show</button>
          </div>
        </div>
 
        <div class="mb-3">
          <label>Priority Level</label>
          <select class="form-select"
                  [(ngModel)]="priorityLevel" name="priorityLevel">
            <option value="">-- Select Priority Level --</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
 
        <div class="mb-3">
          <label>Priority Description</label>
          <input type="text" class="form-control"
                 [(ngModel)]="priority.priorityDescription"
                 name="priorityDescription">
        </div>
 
        <div class="mb-3">
          <label>Response Time (hrs)</label>
          <input type="number" class="form-control"
                 [(ngModel)]="priority.responseTime"
                 name="responseTime">
        </div>
 
        <div class="mb-3">
          <label>Resolution Time (hrs)</label>
          <input type="number" class="form-control"
                 [(ngModel)]="priority.resolutionTime"
                 name="resolutionTime">
        </div>
 
        <div class="mb-3">
          <label>Search by Priority Level</label>
          <div class="d-flex gap-2">
            <select class="form-select"
                    [(ngModel)]="priorityLevelSearch"
                    name="priorityLevelSearch">
              <option value="">-- Select Priority Level --</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
            <button class="btn btn-primary" (click)="showPriorityByLevel()">Search</button>
          </div>
        </div>
 
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-success" (click)="savePriority()">Add</button>
          <button class="btn btn-warning" (click)="updatePriority()">Update</button>
          <button class="btn btn-danger" (click)="deletePriority()">Delete</button>
        </div>
 
        <p class="text-danger mt-2">{{ errMsg }}</p>
      </div>
    </div>
 
    <div class="col-md-7 mb-4">
      <div class="card p-4">
        <h2>List of Ticket Priorities</h2>
 
        <button class="btn btn-secondary mb-3" (click)="goBack()">← Back</button>
 
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Level</th>
              <th>Description</th>
              <th>Response Time</th>
              <th>Resolution Time</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of priorities">
              <td>{{ p.priorityId }}</td>
              <td>{{ p.priorityLevel }}</td>
              <td>{{ p.priorityDescription }}</td>
              <td>{{ p.responseTime }}</td>
              <td>{{ p.resolutionTime }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
 
  </div>
</div>
