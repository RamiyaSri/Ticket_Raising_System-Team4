<div class="container mt-5">
<div class="row justify-content-center">
 
    <div class="col-md-4">
<div class="card p-4 shadow-lg text-white border border-light rounded-4"

           style="background-color: rgba(0,0,0,0.3);">
 
        <h2 class="text-glow text-center mb-4">Employee Login</h2>
 
        <div class="mb-3">
<label>Employee ID</label>
<input type="text"

                 class="form-control galaxy-input"

                 [(ngModel)]="empId"

                 name="empId" />
</div>
 
        <div class="mb-3">
<label>Password</label>
<input type="password"

                 class="form-control galaxy-input"

                 [(ngModel)]="password"

                 name="password" />
</div>
 
        <button class="btn btn-success glow-btn w-100"

                (click)="login()">Login</button>
 
        <p class="text-danger mt-3 text-center">{{ errMsg }}</p>
</div>
</div>
 
  </div>
</div>
